<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho ₹50 Cashback Offer</title>
  <style>
    :root {
      --primary-color: #9c27b0;
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #333333;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: sans-serif; 
    }
    body { 
      background-color: var(--bg-color); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }
    .form-container { 
      background-color: var(--card-bg); 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      max-width: 480px; 
      width: 100%; 
      padding: 32px; 
      text-align: center; 
    }
    .logo-container img { 
      max-width: 220px; 
      width: 100%;
      margin-bottom: 18px; 
    }
    h1 { 
      color: var(--primary-color); 
      font-size: 32px; 
      font-weight: 800;
      margin-bottom: 8px; 
    }
    h2 { 
      font-size: 20px; 
      margin-bottom: 12px; 
    }
    p { 
      font-size: 14px; 
      color: #666; 
      margin-bottom: 24px; 
    }
    .store-link { 
      margin-bottom: 20px; 
    }
    .store-link a { 
      display: inline-block; 
      background-color: #f3e5f5; 
      color: #9c27b0; 
      padding: 10px 20px; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: bold; 
    }
    .form-group { 
      text-align: left; 
      margin-bottom: 18px; 
    }
    label { 
      display: block; 
      font-size: 13px; 
      font-weight: 600; 
      margin-bottom: 6px; 
    }
    input[type="text"], 
    input[type="tel"], 
    input[type="email"] { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      font-size: 14px; 
    }
    input[type="file"] { 
      padding: 8px; 
      font-size: 13px; 
    }
    .submit-btn { 
      width: 100%; 
      background-color: var(--primary-color); 
      color: #fff; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
    }
    .submit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="logo-container">
      <img src="https://images.meesho.com/images/marketing/1661417516766.png" alt="Meesho">
    </div>
    <h1>Meesho Verification</h1>
    <h2>₹50/- Cashback Offer</h2>
    <p>Share screenshot to receive cashback.</p>
    
    <div class="store-link">
      <a href="https://www.meesho.com/PiyushKumawat?ms=2" target="_blank">Open Meesho Profile</a>
    </div>
    
    <form id="cashbackForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="Name" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="Phone" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="Email" required>
      </div>
      <div class="form-group">
        <label>UPI ID (For Cashback)</label>
        <input type="text" id="UPI" placeholder="e.g. mobile@upi" required>
      </div>
      <div class="form-group">
        <label>Order ID</label>
        <input type="text" id="OrderID" required>
      </div>
      <div class="form-group">
        <label>Screenshot</label>
        <input type="file" id="Screenshot" accept="image/*" required>
      </div>
      <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw6eTYDPIBfn8CNz_nEwziq4xJcBF073gfvstk3vHtBXGxvZr3O79waROjSyov7NoI3/exec'; 
    
    const form = document.getElementById('cashbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('Screenshot');
      const file = fileInput.files[0];
      
      if (!file) {
        alert("Please select a screenshot.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Uploading...";
      statusMessage.style.color = "#333";
      statusMessage.innerText = "Please wait, submitting your details...";

      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Data = event.target.result.split(',')[1];
        
        const payload = {
          Name: document.getElementById('Name').value,
          Phone: document.getElementById('Phone').value,
          Email: document.getElementById('Email').value,
          UPI: document.getElementById('UPI').value,
          OrderID: document.getElementById('OrderID').value,
          fileName: file.name,
          fileType: file.type,
          fileData: base64Data
        };

        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            statusMessage.style.color = "green";
            statusMessage.innerText = "Details submitted successfully! Cashback will be processed soon.";
            form.reset();
          } else {
            throw new Error(data.message || "Submission failed");
          }
        })
        .catch(error => {
          statusMessage.style.color = "red";
          statusMessage.innerText = "Error submitting form. Please try again.";
          console.error('Error:', error);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
        });
      };
      
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
