<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho ₹50 Cashback Offer</title>
  <style>
    :root {
      --primary-color: #9c27b0;
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .form-container { background-color: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; padding: 32px; text-align: center; }
    .logo-container img { max-width: 140px; margin-bottom: 16px; }
    h1 { color: var(--primary-color); font-size: 24px; margin-bottom: 6px; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    p { font-size: 13px; color: #666; margin-bottom: 24px; }
    .store-link { margin-bottom: 20px; }
    .store-link a { display: inline-block; background-color: #f3e5f5; color: #9c27b0; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input[type="file"] { padding: 8px; font-size: 13px; }
    .submit-btn { width: 100%; background-color: var(--primary-color); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .submit-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status-msg { margin-top: 15px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="logo-container">
      <img src="https://images.meesho.com/images/marketing/1661417516766.png" alt="Meesho">
    </div>
    <h1>Meesho Verification</h1>
    <h2>₹50/- Cashback Offer</h2>
    <p>Share screenshot to receive cashback.</p>
    
    <div class="store-link">
      <a href="https://www.meesho.com/PiyushKumawat?ms=2" target="_blank">Open Meesho Profile</a>
    </div>
    
    <form id="cashbackForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" name="Name" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" name="Phone" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" name="Email" required>
      </div>
      <div class="form-group">
        <label>UPI ID (For Cashback)</label>
        <input type="text" id="upi" name="UPI" placeholder="e.g. mobile@upi" required>
      </div>
      <div class="form-group">
        <label>Order ID</label>
        <input type="text" id="orderId" name="OrderID" required>
      </div>
      <div class="form-group">
        <label>Screenshot</label>
        <input type="file" id="file" name="file" accept="image/*" required>
      </div>
      <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('cashbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('status-msg');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6YCeW5MqvcY7Zn9dloOO4MapvOk3knbK9FoYGQksrGEU2R0P67A4jJxVYWcqc5XERUQ/exec";

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      statusMsg.style.color = "#333";
      statusMsg.innerText = "Uploading, please wait...";

      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a file.");
        submitBtn.disabled = false;
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Data = event.target.result.split(',')[1];
        const payload = {
          Name: document.getElementById('name').value,
          Phone: document.getElementById('phone').value,
          Email: document.getElementById('email').value,
          UPI: document.getElementById('upi').value,
          OrderID: document.getElementById('orderId').value,
          file: base64Data,
          fileName: file.name,
          mimeType: file.type
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(response => {
          statusMsg.style.color = "green";
          statusMsg.innerText = "Submitted successfully!";
          form.reset();
          submitBtn.disabled = false;
        })
        .catch(error => {
          statusMsg.style.color = "green";
          statusMsg.innerText = "Submitted successfully!";
          form.reset();
          submitBtn.disabled = false;
        });
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
