<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho ₹35 Cashback Offer</title>
  <style>
    :root {
      --primary-color: #9c27b0;
      --primary-hover: #7b1fa2;
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #666666;
      --border-color: #e0e0e0;
      --success-color: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 16px;
    }

    .logo-container img {
      max-width: 140px;
      height: auto;
      display: inline-block;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .instructions {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 8px;
    }

    .store-link-banner {
      background-color: #f3e5f5;
      border: 1px dashed var(--primary-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .store-link-banner span {
      font-size: 13px;
      font-weight: 500;
      color: var(--primary-color);
    }

    .store-link-banner a {
      color: #ffffff;
      background-color: var(--primary-color);
      padding: 6px 14px;
      font-size: 12px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .store-link-banner a:hover {
      background-color: var(--primary-hover);
    }

    .qr-container {
      margin-top: 4px;
    }

    .qr-container img {
      width: 110px;
      height: 110px;
      border-radius: 4px;
      background: #ffffff;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .form-group input[type="file"] {
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="logo-container">
      <img src="https://images.meesho.com/images/marketing/1661417516766.png" alt="Meesho Logo">
    </div>

    <h1 class="header-title">Meesho Verification</h1>
    <h2 class="header-subtitle">₹35/- Cashback Offer</h2>
    <p class="instructions">
      Share a 5-star product review screenshot along with your order details to receive ₹35 instant cashback directly into your account.
    </p>

    <!-- Meesho Dashboard/Store Redirection & Dynamic QR Code -->
    <div class="store-link-banner">
      <span>Visit Store / Orders Dashboard:</span>
      <a href="YOUR_MEESHO_DASHBOARD_URL" target="_blank" rel="noopener noreferrer">Open Meesho Dashboard</a>
      <div class="qr-container">
        <!-- Generates dynamic QR code targeting your store URL -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YOUR_MEESHO_DASHBOARD_URL" alt="Scan QR Code">
      </div>
    </div>

    <!-- Submission Form -->
    <form action="https://script.google.com/macros/s/AKfycbw6YCeW5MqvcY7Zn9dloOO4MapvOk3knbK9FoYGQksrGEU2R0P67A4jJxVYWcqc5XERUQ/exec" method="POST" enctype="multipart/form-data">
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="Name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone / WhatsApp Number</label>
        <input type="tel" id="phone" name="Phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="Email" placeholder="Enter email address" required>
      </div>

      <div class="form-group">
        <label for="upi">UPI ID (For Cashback Credit)</label>
        <input type="text" id="upi" name="UPI" placeholder="e.g. username@upi" required>
      </div>

      <div class="form-group">
        <label for="screenshot">5-Star Review Screenshot</label>
        <input type="file" id="screenshot" name="file" accept="image/*" required>
      </div>

      <button type="submit" class="submit-btn">Submit for Cashback</button>
    </form>
  </div>

</body>
</html>
